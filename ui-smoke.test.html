<!doctype html>
<meta charset="utf-8">
<title>CPQ WebUI smoke tests</title>
<pre id="result">RUNNING</pre>
<iframe id="app" src="./index.html" title="Test app" width="390" height="844"></iframe>
<script type="module">
  const result = document.querySelector('#result');
  const frame = document.querySelector('#app');
  const assert = (condition, message) => {
    if (!condition) throw new Error(message);
  };
  const waitFor = async predicate => {
    for (let attempt = 0; attempt < 50; attempt += 1) {
      if (predicate()) return;
      await new Promise(resolve => setTimeout(resolve, 50));
    }
    throw new Error('application did not finish rendering');
  };

  frame.addEventListener('load', async () => {
    try {
      const doc = frame.contentDocument;
      await waitFor(() => doc.querySelectorAll('.rating-item').length === 9);

      assert(doc.querySelector('#communicationStrainValue'), 'communication strain result card');
      assert(doc.querySelector('#divorceProbabilityValue').textContent.trim() === '不可计算', 'probability disabled by default');
      assert(doc.querySelectorAll('#ecrQuestions .question').length === 36, 'ECR-R item count');
      assert(doc.querySelectorAll('#dciScoreGrid input').length === 12, 'DCI manual score fields');
      assert(doc.querySelector('#assessmentDate').value, 'longitudinal date initialization');

      await waitFor(() => !doc.querySelector('#cloudStatus').textContent.includes('正在检查'));
      const cloudOnline = doc.querySelector('#cloudStatus').textContent === '远程服务在线';
      assert(doc.querySelector('#createSessionBtn').disabled === !cloudOnline, 'cloud create readiness gate');
      assert(doc.querySelector('#joinSessionBtn').disabled === !cloudOnline, 'cloud join readiness gate');
      assert(doc.querySelector('#cloudNotice').hidden === cloudOnline, 'cloud availability notice');

      doc.querySelector('[data-tab="observation"]').click();
      const ratings = doc.querySelectorAll('#spaffRatingGrid select');
      assert(ratings.length === 9, 'SPAFF-informed dimension count');
      ratings[0].value = '7';
      ratings[0].dispatchEvent(new Event('change', { bubbles: true }));
      doc.querySelector('#spaffPerson').value = 'B';
      doc.querySelector('#spaffPerson').dispatchEvent(new Event('change', { bubbles: true }));
      doc.querySelector('#spaffPerson').value = 'A';
      doc.querySelector('#spaffPerson').dispatchEvent(new Event('change', { bubbles: true }));
      assert(doc.querySelector('#spaffRatingGrid select').value === '7', 'SPAFF-informed rating persistence');

      doc.querySelector('[data-tab="supplements"]').click();
      assert(doc.querySelector('#supplements').classList.contains('active'), 'supplement panel activation');
      doc.querySelectorAll('#ecrQuestions .question').forEach(question => question.querySelector('input[value="1"]').click());
      doc.querySelector('#submitEcrBtn').click();
      assert(doc.querySelector('#ecrPerson').value === 'B', 'ECR-R A submission and handoff');
      assert(doc.querySelector('#ecrProgressA').textContent.includes('已锁定'), 'ECR-R submission lock');
      assert(
        doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1,
        `supplement mobile overflow: ${doc.documentElement.scrollWidth}/${doc.documentElement.clientWidth}`
      );
      doc.querySelector('[data-tab="longitudinal"]').click();
      assert(doc.querySelector('#longitudinalFiles').multiple, 'multiple longitudinal file upload');

      assert(
        doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1,
        `mobile horizontal overflow: ${doc.documentElement.scrollWidth}/${doc.documentElement.clientWidth}`
      );
      result.textContent = 'PASS';
    } catch (error) {
      result.textContent = `FAIL: ${error.message}`;
    }
  }, { once: true });
</script>
