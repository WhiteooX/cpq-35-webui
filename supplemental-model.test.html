<!doctype html>
<meta charset="utf-8">
<title>Supplemental model tests</title>
<pre id="result">RUNNING</pre>
<script src="./dci-config.js"></script>
<script type="module">
  import {
    ECR_R_ITEMS,
    blankEcrAnswers,
    inspectEcrAnswers,
    scoreEcrR,
    validateDciScores,
    validateDciItemBank,
    scoreAuthorizedDci,
    DCI_CANONICAL_KEY
  } from './supplemental-model.mjs';
  import {
    LONGITUDINAL_SCHEMA,
    buildLongitudinalDataset,
    summarizeChange
  } from './longitudinal-model.mjs';

  const assert = (condition, message) => {
    if (!condition) throw new Error(message);
  };

  try {
    assert(ECR_R_ITEMS.length === 36, 'ECR-R item count');
    assert(inspectEcrAnswers(blankEcrAnswers()).answered === 0, 'blank ECR inspection');
    const officialExample = [1, 2, 2, 1, 3, 2, 2, 2, 1, 1, 6, 2, 2, 2, 3, 2, 5, 1, 2, 5, 2, 5, 2, 4, 2, 6, 6, 7, 7, 5, 6, 2, 6, 6, 6, 6];
    const ecr = scoreEcrR(officialExample);
    assert(ecr.complete && ecr.anxiety === 2.33 && ecr.avoidance === 2.17, 'official ECR scoring example');
    assert(scoreEcrR(Array(36).fill(1)).anxiety === 1.67, 'ECR reverse keys');

    const dciManual = validateDciScores({ totalWithoutEvaluation: 100, common: 20 });
    assert(dciManual.available && dciManual.valid && dciManual.scores.totalWithoutEvaluation === 100, 'manual DCI scores');
    assert(!validateDciScores({ totalWithoutEvaluation: 176 }).valid, 'DCI range guard');
    assert(!validateDciItemBank(null).valid, 'DCI authorization guard');
    const subscaleById = new Map(Object.entries(DCI_CANONICAL_KEY).flatMap(([subscale, ids]) => ids.map(id => [id, subscale])));
    const reversed = new Set([7, 10, 11, 15, 22, 25, 26, 27]);
    const bank = {
      version: 'synthetic-test-only',
      language: 'test',
      authorizationConfirmed: true,
      items: Array.from({ length: 37 }, (_, index) => ({
        id: index + 1,
        text: `Synthetic test item ${index + 1}`,
        subscale: index < 35 ? subscaleById.get(index + 1) : 'evaluation',
        reverse: reversed.has(index + 1)
      })).reverse()
    };
    const dci = scoreAuthorizedDci(Array(37).fill(1), bank);
    assert(dci.complete && dci.scores.totalWithoutEvaluation === 67, 'authorized DCI scoring and item-id order');
    assert(validateDciItemBank(window.CPQ_DCI_ITEM_BANK).valid, 'bundled official DCI item bank');
    assert(window.CPQ_DCI_ITEM_BANK.items.length === 37, 'bundled DCI item count');
    assert(window.CPQ_DCI_ITEM_BANK.items.every(item => typeof item.zh === 'string' && item.zh.trim()), 'bundled DCI Chinese reading aids');
    assert(window.CPQ_DCI_ITEM_BANK.translationStatus.includes('unvalidated'), 'DCI non-validated translation status');
    const officialReverseIds = window.CPQ_DCI_ITEM_BANK.items.filter(item => item.reverse).map(item => item.id);
    assert(JSON.stringify(officialReverseIds) === JSON.stringify([...reversed]), 'official DCI reverse-key IDs');
    const officialAllOnes = scoreAuthorizedDci(Array(37).fill(1), window.CPQ_DCI_ITEM_BANK);
    assert(officialAllOnes.complete && officialAllOnes.scores.totalWithoutEvaluation === 67, 'bundled official DCI scoring');
    const theoreticalMaximumAnswers = Array(37).fill(5);
    [...reversed].forEach(id => { theoreticalMaximumAnswers[id - 1] = 1; });
    const officialMaximum = scoreAuthorizedDci(theoreticalMaximumAnswers, window.CPQ_DCI_ITEM_BANK);
    assert(officialMaximum.scores.totalWithoutEvaluation === 175, 'official DCI theoretical maximum');
    assert(officialMaximum.scores.selfNegative === 20 && officialMaximum.scores.partnerNegative === 20, 'official DCI negative-subscale reverse scoring');
    assert(officialMaximum.scores.satisfaction === 5 && officialMaximum.scores.effectiveness === 5, 'DCI evaluation items remain separate');
    assert(!scoreAuthorizedDci([...Array(36).fill(1), 0], window.CPQ_DCI_ITEM_BANK).complete, 'DCI response range guard');
    const driftedBank = structuredClone(window.CPQ_DCI_ITEM_BANK);
    driftedBank.items[0].subscale = 'common';
    assert(!validateDciItemBank(driftedBank).valid, 'DCI official scoring-key drift guard');

    const record = (date, strain) => ({
      schema: LONGITUDINAL_SCHEMA,
      assessment: { coupleId: 'study_001', date, timepoint: date },
      measures: { cpq: { communicationStrain: { value: strain } } }
    });
    const dataset = buildLongitudinalDataset([record('2026-01-01', 30), record('2026-03-01', 42)]);
    assert(dataset.accepted.length === 2 && !dataset.rejected.length, 'longitudinal import');
    assert(summarizeChange(dataset.accepted, 'communicationStrain').change === 12, 'longitudinal change');
    const duplicate = buildLongitudinalDataset([record('2026-01-01', 30), record('2026-01-01', 35)]);
    assert(duplicate.accepted.length === 1 && duplicate.rejected[0].errors[0] === 'duplicate', 'duplicate guard');
    assert(buildLongitudinalDataset([record('2026-02-31', 30)]).rejected[0].errors.includes('date'), 'calendar date guard');

    document.querySelector('#result').textContent = 'PASS';
  } catch (error) {
    document.querySelector('#result').textContent = `FAIL: ${error.message}`;
  }
</script>
