<!doctype html>
<meta charset="utf-8">
<title>Cloud session UI integration tests</title>
<pre id="result">RUNNING</pre>
<div id="frames"></div>
<script>
  const backend = {
    code: '482913',
    tokenA: 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
    tokenB: 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
    submittedA: false,
    submittedB: false,
    answersA: Array(35).fill(null),
    answersB: Array(35).fill(null),
    ecrSubmittedA: false,
    ecrSubmittedB: false,
    ecrAnswersA: Array(36).fill(null),
    ecrAnswersB: Array(36).fill(null),
    dciSubmittedA: false,
    dciSubmittedB: false,
    dciAnswersA: Array(37).fill(null),
    dciAnswersB: Array(37).fill(null),
    dciScoresA: {},
    dciScoresB: {},
    csiSubmittedA: false, csiSubmittedB: false, csiAnswersA: Array(32).fill(null), csiAnswersB: Array(32).fill(null),
    gmsexSubmittedA: false, gmsexSubmittedB: false, gmsexAnswersA: Array(5).fill(null), gmsexAnswersB: Array(5).fill(null),
    nsssSubmittedA: false, nsssSubmittedB: false, nsssAnswersA: Array(12).fill(null), nsssAnswersB: Array(12).fill(null),
    kosSubmittedA: false, kosSubmittedB: false, kosAnswersA: Array(18).fill(null), kosAnswersB: Array(18).fill(null),
    promisSubmittedA: false, promisSubmittedB: false,
    promisResponseA: { profile: 'vaginal', answers: {}, reasons: [] },
    promisResponseB: { profile: 'vaginal', answers: {}, reasons: [] },
    rfsSubmittedA: false, rfsSubmittedB: false, rfsAnswersA: Array(12).fill(null), rfsAnswersB: Array(12).fill(null)
  };
  const answeredCount = answers => answers.filter(Number.isInteger).length;

  window.handleCloudTestFetch = async (url, options) => {
    const name = new URL(url).pathname.split('/').pop();
    const body = JSON.parse(options.body || '{}');
    if (name === 'cpq_service_status') {
      return { status: 200, body: { status: 'ok', schemaVersion: 8, features: ['serverDciScoring', 'measureProgressCounts', 'relationshipOutcomeMeasures', 'sexSubMeasures', 'promisSexFsProfiles'], sessionRetentionDays: 30 } };
    }
    if (name === 'create_couple_session') {
      return { status: 200, body: { code: backend.code, role: 'A', token: backend.tokenA } };
    }
    if (name === 'join_couple_session' && body.p_code === backend.code) {
      return {
        status: 200,
        body: { code: backend.code, role: 'B', token: backend.tokenB, submittedA: backend.submittedA, submittedB: backend.submittedB }
      };
    }
    if (name === 'get_couple_session') {
      const isA = body.p_token === backend.tokenA;
      const ecrReady = backend.ecrSubmittedA && backend.ecrSubmittedB;
      const dciReady = backend.dciSubmittedA && backend.dciSubmittedB;
      return {
        status: 200,
        body: {
          code: backend.code,
          role: isA ? 'A' : 'B',
          submittedA: backend.submittedA,
          submittedB: backend.submittedB,
          answeredCountA: answeredCount(backend.answersA),
          answeredCountB: answeredCount(backend.answersB),
          myAnswers: isA ? backend.answersA : backend.answersB,
          answersA: null,
          answersB: null,
          ecrSubmittedA: backend.ecrSubmittedA,
          ecrSubmittedB: backend.ecrSubmittedB,
          ecrAnsweredCountA: answeredCount(backend.ecrAnswersA),
          ecrAnsweredCountB: answeredCount(backend.ecrAnswersB),
          myEcrAnswers: isA ? backend.ecrAnswersA : backend.ecrAnswersB,
          ecrAnswersA: ecrReady ? backend.ecrAnswersA : null,
          ecrAnswersB: ecrReady ? backend.ecrAnswersB : null,
          dciSubmittedA: backend.dciSubmittedA,
          dciSubmittedB: backend.dciSubmittedB,
          dciAnsweredCountA: answeredCount(backend.dciAnswersA),
          dciAnsweredCountB: answeredCount(backend.dciAnswersB),
          myDciAnswers: isA ? backend.dciAnswersA : backend.dciAnswersB,
          myDciScores: isA ? backend.dciScoresA : backend.dciScoresB,
          dciAnswersA: dciReady ? backend.dciAnswersA : null,
          dciAnswersB: dciReady ? backend.dciAnswersB : null,
          dciScoresA: dciReady ? backend.dciScoresA : null,
          dciScoresB: dciReady ? backend.dciScoresB : null,
          ...Object.fromEntries(['csi', 'gmsex', 'nsss', 'kos', 'rfs'].flatMap(measure => {
            const prefix = measure[0].toUpperCase() + measure.slice(1);
            const ready = backend[`${measure}SubmittedA`] && backend[`${measure}SubmittedB`];
            return [
              [`${measure}SubmittedA`, backend[`${measure}SubmittedA`]],
              [`${measure}SubmittedB`, backend[`${measure}SubmittedB`]],
              [`${measure}AnsweredCountA`, answeredCount(backend[`${measure}AnswersA`])],
              [`${measure}AnsweredCountB`, answeredCount(backend[`${measure}AnswersB`])],
              [`my${prefix}Answers`, isA ? backend[`${measure}AnswersA`] : backend[`${measure}AnswersB`]],
              [`${measure}AnswersA`, ready ? backend[`${measure}AnswersA`] : null],
              [`${measure}AnswersB`, ready ? backend[`${measure}AnswersB`] : null]
            ];
          })),
          promisSubmittedA: backend.promisSubmittedA,
          promisSubmittedB: backend.promisSubmittedB,
          promisAnsweredCountA: Object.keys(backend.promisResponseA.answers).length + (backend.promisResponseA.answers.activity === 1 && backend.promisResponseA.reasons.length ? 1 : 0),
          promisAnsweredCountB: Object.keys(backend.promisResponseB.answers).length + (backend.promisResponseB.answers.activity === 1 && backend.promisResponseB.reasons.length ? 1 : 0),
          promisRequiredCountA: backend.promisResponseA.answers.activity === 1 ? 4 : 3,
          promisRequiredCountB: backend.promisResponseB.answers.activity === 1 ? 4 : 3,
          myPromisResponse: isA ? backend.promisResponseA : backend.promisResponseB,
          promisResponseA: backend.promisSubmittedA && backend.promisSubmittedB ? backend.promisResponseA : null,
          promisResponseB: backend.promisSubmittedA && backend.promisSubmittedB ? backend.promisResponseB : null,
          spaffEvents: [],
          spaffRatings: { A: {}, B: {} }
        }
      };
    }
    if (name === 'save_couple_answers') {
      const isA = body.p_token === backend.tokenA;
      backend[isA ? 'answersA' : 'answersB'] = body.p_answers;
      if (body.p_submit) backend[isA ? 'submittedA' : 'submittedB'] = true;
      return { status: 200, body: { ok: true, role: isA ? 'A' : 'B', submitted: Boolean(body.p_submit) } };
    }
    if (name === 'save_ecr_answers') {
      const isA = body.p_token === backend.tokenA;
      backend[isA ? 'ecrAnswersA' : 'ecrAnswersB'] = body.p_answers;
      if (body.p_submit) backend[isA ? 'ecrSubmittedA' : 'ecrSubmittedB'] = true;
      return { status: 200, body: { ok: true, role: isA ? 'A' : 'B', submitted: Boolean(body.p_submit) } };
    }
    if (name === 'save_dci_data') {
      const isA = body.p_token === backend.tokenA;
      backend[isA ? 'dciAnswersA' : 'dciAnswersB'] = body.p_answers;
      backend[isA ? 'dciScoresA' : 'dciScoresB'] = body.p_scores;
      if (body.p_submit) backend[isA ? 'dciSubmittedA' : 'dciSubmittedB'] = true;
      return { status: 200, body: { ok: true, role: isA ? 'A' : 'B', submitted: Boolean(body.p_submit) } };
    }
    if (name === 'save_relationship_measure') {
      const isA = body.p_token === backend.tokenA;
      backend[`${body.p_measure}Answers${isA ? 'A' : 'B'}`] = body.p_answers;
      if (body.p_submit) backend[`${body.p_measure}Submitted${isA ? 'A' : 'B'}`] = true;
      return { status: 200, body: { ok: true, role: isA ? 'A' : 'B', submitted: Boolean(body.p_submit) } };
    }
    if (name === 'save_promis_sexfs') {
      const isA = body.p_token === backend.tokenA;
      backend[`promisResponse${isA ? 'A' : 'B'}`] = body.p_response;
      if (body.p_submit) backend[`promisSubmitted${isA ? 'A' : 'B'}`] = true;
      return { status: 200, body: { ok: true, role: isA ? 'A' : 'B', submitted: Boolean(body.p_submit) } };
    }
    return { status: 404, body: { message: `Unhandled test RPC: ${name}` } };
  };
</script>
<script type="module">
  const output = document.querySelector('#result');
  const frames = document.querySelector('#frames');
  const assert = (condition, message) => {
    if (!condition) throw new Error(message);
  };
  const waitFor = async (predicate, message, attempts = 160) => {
    for (let attempt = 0; attempt < attempts; attempt += 1) {
      if (predicate()) return;
      await new Promise(resolve => setTimeout(resolve, 50));
    }
    throw new Error(message);
  };
  const appHtml = await fetch('./index.html').then(response => response.text());
  const base = new URL('./', location.href).href;
  const instrumented = appHtml
    .replace('<head>', `<head><base href="${base}">`)
    .replace(
      '<script src="supabase-config.js"><' + '/script>',
      `<script>
        window.CPQ_SUPABASE = { url: 'https://test.supabase.co', anonKey: 'sb_publishable_test' };
        window.fetch = async (url, options) => {
          const result = await parent.handleCloudTestFetch(url, options);
          return new Response(JSON.stringify(result.body), {
            status: result.status,
            headers: { 'Content-Type': 'application/json' }
          });
        };
      <\/script>`
    );

  function addDevice(name) {
    const frame = document.createElement('iframe');
    frame.title = name;
    frame.width = '390';
    frame.height = '500';
    frame.srcdoc = instrumented;
    frames.append(frame);
    return frame;
  }

  try {
    const deviceA = addDevice('Device A');
    const deviceB = addDevice('Device B');
    await waitFor(
      () => deviceA.contentDocument?.querySelector('#cloudStatus')?.textContent === '远程服务在线' &&
        deviceB.contentDocument?.querySelector('#cloudStatus')?.textContent === '远程服务在线',
      'both devices did not reach cloud-ready state'
    );

    const docA = deviceA.contentDocument;
    docA.querySelector('#createPin').value = '123456';
    docA.querySelector('#createSessionBtn').click();
    await waitFor(() => docA.querySelector('#activeCode')?.textContent === backend.code, 'device A did not create session');
    assert(docA.querySelector('#activeRole').textContent === 'A', 'device A role');

    const docB = deviceB.contentDocument;
    docB.querySelector('#joinCode').value = backend.code;
    docB.querySelector('#joinPin').value = '123456';
    docB.querySelector('#joinSessionBtn').click();
    await waitFor(() => docB.querySelector('#activeCode')?.textContent === backend.code, 'device B did not join session');
    assert(docB.querySelector('#activeRole').textContent === 'B', 'device B role');

    docB.querySelector('[data-tab="questionnaire"]').click();
    docB.querySelectorAll('#questions .question').forEach(question => question.querySelector('input[value="3"]').click());
    docB.querySelector('.stage[data-stage="discussion"]').click();
    const discussionQuestions = [...docB.querySelectorAll('#questions .question')];
    discussionQuestions.slice(0, 4).forEach(question => question.querySelector('input[value="4"]').click());
    const stableQuestionNode = docB.querySelector('#questions .question');
    await waitFor(
      () => answeredCount(backend.answersB) === 8 && docB.querySelector('#cpqSyncStatus').textContent === '云端已同步',
      'CPQ near-real-time draft or sync feedback failed'
    );
    await waitFor(() => docA.querySelector('#progressB').textContent.startsWith('8/35'), 'partner CPQ progress did not cross devices');
    assert(docB.querySelector('#questions .question') === stableQuestionNode, 'silent polling rebuilt the active CPQ form');

    backend.answersA = Array(35).fill(2);
    backend.submittedA = true;
    await waitFor(() => docB.querySelector('#submitA')?.textContent.includes('已锁定'), 'automatic cross-device polling failed');
    assert(docB.querySelector('#progressA').textContent === '35/35 · 已锁定', 'locked partner progress must remain 35/35');

    docA.querySelector('[data-tab="supplements"]').click();
    docA.querySelectorAll('#ecrQuestions .question').forEach(question => question.querySelector('input[value="1"]').click());
    docA.querySelector('#submitEcrBtn').click();
    await waitFor(() => backend.ecrSubmittedA, 'device A ECR-R did not sync');
    assert(docA.querySelector('#ecrResults').hidden, 'ECR-R result leaked before both submissions');

    docB.querySelector('[data-tab="supplements"]').click();
    docB.querySelectorAll('#ecrQuestions .question').forEach(question => question.querySelector('input[value="2"]').click());
    docB.querySelector('#submitEcrBtn').click();
    await waitFor(() => !docA.querySelector('#ecrResults').hidden, 'ECR-R cross-device unlock failed');

    docA.querySelectorAll('#dciQuestions .question').forEach(question => question.querySelector('input[value="1"]').click());
    docA.querySelector('#submitDciBtn').click();
    await waitFor(() => backend.dciSubmittedA, 'device A DCI did not sync');
    assert(docA.querySelector('#dciTotalB').textContent === '—', 'DCI result leaked before both submissions');

    docB.querySelectorAll('#dciQuestions .question').forEach(question => question.querySelector('input[value="2"]').click());
    docB.querySelector('#submitDciBtn').click();
    await waitFor(() => docA.querySelector('#dciTotalB').textContent === '86/175', 'DCI cross-device unlock failed');
    assert(!docA.querySelector('#dciResults').hidden, 'complete DCI subscale results did not unlock');

    docA.querySelectorAll('#csiQuestions .question').forEach(question => question.querySelector('input[value="5"]').click());
    docA.querySelector('#submitCsiBtn').click();
    await waitFor(() => backend.csiSubmittedA, 'device A CSI did not sync');
    assert(docA.querySelector('#csiResults').hidden, 'CSI result leaked before both submissions');
    docB.querySelectorAll('#csiQuestions .question').forEach(question => question.querySelector('input[value="5"]').click());
    docB.querySelector('#submitCsiBtn').click();
    await waitFor(() => !docA.querySelector('#csiResults').hidden, 'CSI cross-device unlock failed');

    docA.querySelectorAll('#nsssQuestions .question').forEach(question => question.querySelector('input[value="5"]').click());
    docA.querySelector('#submitNsssBtn').click();
    await waitFor(() => backend.nsssSubmittedA, 'device A NSSS-S did not sync');
    assert(docA.querySelector('#nsssResults').hidden, 'NSSS-S result leaked before both submissions');
    docB.querySelectorAll('#nsssQuestions .question').forEach(question => question.querySelector('input[value="4"]').click());
    docB.querySelector('#submitNsssBtn').click();
    await waitFor(() => !docA.querySelector('#nsssResults').hidden, 'NSSS-S cross-device unlock failed');

    const answerInactivePromis = doc => {
      doc.querySelector('#promisQuestions input[name$="interestLevel"][value="5"]').click();
      doc.querySelector('#promisQuestions input[name$="interestFrequency"][value="5"]').click();
      doc.querySelector('#promisQuestions input[name$="activity"][value="1"]').click();
      doc.querySelector('#promisQuestions .reason-choice-grid input').click();
      doc.querySelector('#submitPromisBtn').click();
    };
    answerInactivePromis(docA);
    await waitFor(() => backend.promisSubmittedA, 'device A PROMIS did not sync');
    assert(docA.querySelector('#promisResults').hidden, 'PROMIS result leaked before both submissions');
    answerInactivePromis(docB);
    await waitFor(() => !docA.querySelector('#promisResults').hidden, 'PROMIS cross-device unlock failed');
    deviceA.contentWindow.localStorage.removeItem('cpqSessionV2');
    deviceB.contentWindow.localStorage.removeItem('cpqSessionV2');
    output.textContent = 'PASS';
  } catch (error) {
    output.textContent = `FAIL: ${error.message}`;
  }
</script>
