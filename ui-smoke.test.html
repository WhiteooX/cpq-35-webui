<!doctype html>
<meta charset="utf-8">
<title>CPQ WebUI smoke tests</title>
<pre id="result">RUNNING</pre>
<iframe id="app" src="./index.html" title="Test app" width="390" height="844"></iframe>
<script type="module">
  const result = document.querySelector('#result');
  const frame = document.querySelector('#app');
  const assert = (condition, message) => {
    if (!condition) throw new Error(message);
  };
  const waitFor = async predicate => {
    for (let attempt = 0; attempt < 50; attempt += 1) {
      if (predicate()) return;
      await new Promise(resolve => setTimeout(resolve, 50));
    }
    throw new Error('application did not finish rendering');
  };

  frame.addEventListener('load', async () => {
    try {
      const doc = frame.contentDocument;
      await waitFor(() => doc.querySelectorAll('.rating-item').length === 9);

      assert(doc.querySelector('#communicationStrainValue'), 'communication strain result card');
      assert(doc.querySelector('#divorceProbabilityValue').textContent.trim() === '不可计算', 'probability disabled by default');
      assert(doc.querySelectorAll('#ecrQuestions .question').length === 36, 'ECR-R item count');
      assert(doc.querySelectorAll('#dciQuestions .question').length === 37, 'complete official DCI-37 item count');
      assert(doc.querySelectorAll('#csiQuestions .question').length === 32, 'CSI-32 item count');
      assert(doc.querySelectorAll('#gmsexQuestions .question').length === 5, 'GMSEX item count');
      assert(doc.querySelectorAll('#nsssQuestions .question').length === 12, 'NSSS-S item count');
      assert(doc.querySelectorAll('#kosQuestions .question').length === 18, 'KOS-18 item count');
      assert(doc.querySelectorAll('#promisQuestions .question').length === 3, 'PROMIS initial branch item count');
      assert(doc.querySelectorAll('#rfsQuestions .question').length === 12, 'RFS-12 item count');
      assert(doc.querySelector('#gmsexQuestions .question .question-en').textContent.includes('Bad'), 'GMSEX English reference');
      assert(doc.querySelector('#rfsQuestions .question .question-zh').textContent.includes('伴侣'), 'RFS Chinese reading aid');
      assert(doc.querySelector('#dciStatus').textContent.includes('完整 37 题'), 'official DCI status');
      assert(doc.querySelector('#dciStatus').textContent.includes('非官方阅读辅助'), 'DCI translation caveat');
      assert(doc.querySelector('#dciQuestions .question .question-zh').textContent.includes('伴侣'), 'DCI Chinese primary wording');
      assert(doc.querySelector('#dciQuestions .question .question-en').textContent.startsWith('I let my partner'), 'DCI official English reference');
      assert(doc.querySelector('.dci-section-heading span').textContent.includes('压力'), 'DCI Chinese section heading');
      assert(doc.querySelector('.dci-section-heading small').textContent.startsWith('How you communicate'), 'DCI English section reference');
      assert(doc.querySelector('#assessmentDate').value, 'longitudinal date initialization');

      doc.querySelector('[data-tab="questionnaire"]').click();
      const firstCpqChoice = doc.querySelector('#questions .question input[value="1"]');
      firstCpqChoice.click();
      assert(firstCpqChoice.checked, 'single-click CPQ response');
      assert(doc.querySelector('#progressA').textContent.startsWith('1/35'), 'immediate CPQ progress');
      assert(doc.querySelector('#cpqSyncStatus').textContent === '本地即时暂存', 'local CPQ save feedback');
      const answerCpqStage = stage => {
        doc.querySelector(`.stage[data-stage="${stage}"]`).click();
        doc.querySelectorAll('#questions .question').forEach(question => question.querySelector('input[value="1"]').click());
      };
      ['emergence', 'discussion', 'after'].forEach(answerCpqStage);
      doc.querySelector('#submitAnswersBtn').click();
      ['emergence', 'discussion', 'after'].forEach(answerCpqStage);
      doc.querySelector('#submitAnswersBtn').click();
      assert(doc.querySelector('#questionnaire').classList.contains('active'), 'CPQ results stay in questionnaire flow');
      assert(!doc.querySelector('[data-tab="results"]'), 'separate results tab removed');
      assert(!doc.querySelector('#resultContent').hidden, 'embedded CPQ result unlock');
      assert(doc.querySelectorAll('#scoreCards .score-summary-card').length === 3, 'three CPQ score summary cards');

      await waitFor(() => !doc.querySelector('#cloudStatus').textContent.includes('正在检查'));
      const cloudOnline = doc.querySelector('#cloudStatus').textContent === '远程服务在线';
      assert(doc.querySelector('#createSessionBtn').disabled === !cloudOnline, 'cloud create readiness gate');
      assert(doc.querySelector('#joinSessionBtn').disabled === !cloudOnline, 'cloud join readiness gate');
      assert(doc.querySelector('#cloudNotice').hidden === cloudOnline, 'cloud availability notice');

      doc.querySelector('[data-tab="observation"]').click();
      const ratings = doc.querySelectorAll('#spaffRatingGrid select');
      assert(ratings.length === 9, 'SPAFF-informed dimension count');
      ratings[0].value = '7';
      ratings[0].dispatchEvent(new Event('change', { bubbles: true }));
      doc.querySelector('#spaffPerson').value = 'B';
      doc.querySelector('#spaffPerson').dispatchEvent(new Event('change', { bubbles: true }));
      doc.querySelector('#spaffPerson').value = 'A';
      doc.querySelector('#spaffPerson').dispatchEvent(new Event('change', { bubbles: true }));
      assert(doc.querySelector('#spaffRatingGrid select').value === '7', 'SPAFF-informed rating persistence');

      doc.querySelector('[data-tab="supplements"]').click();
      assert(doc.querySelector('#supplements').classList.contains('active'), 'supplement panel activation');
      doc.querySelectorAll('#ecrQuestions .question').forEach(question => question.querySelector('input[value="1"]').click());
      doc.querySelector('#submitEcrBtn').click();
      assert(doc.querySelector('#ecrPerson').value === 'B', 'ECR-R A submission and handoff');
      assert(doc.querySelector('#ecrProgressA').textContent.includes('已锁定'), 'ECR-R submission lock');
      for (const measure of ['csi', 'gmsex', 'nsss', 'kos', 'rfs']) {
        const answerValue = measure === 'gmsex' ? '7' : '5';
        doc.querySelectorAll(`#${measure}Questions .question`).forEach(question => question.querySelector(`input[value="${answerValue}"]`).click());
        doc.querySelector(`#submit${measure[0].toUpperCase()}${measure.slice(1)}Btn`).click();
        doc.querySelectorAll(`#${measure}Questions .question`).forEach(question => question.querySelector(`input[value="${answerValue}"]`).click());
        doc.querySelector(`#submit${measure[0].toUpperCase()}${measure.slice(1)}Btn`).click();
        assert(!doc.querySelector(`#${measure}Results`).hidden, `${measure} local dyadic result unlock`);
      }
      assert(doc.querySelector('#csiScoreA').textContent === '145/161', 'CSI reverse scoring in UI');
      assert(doc.querySelector('#gmsexScoreA').textContent === '7.00/7', 'GMSEX mean in UI');
      assert(doc.querySelector('#nsssScoreA').textContent.startsWith('60/60'), 'NSSS-S total in UI');
      assert(doc.querySelector('#kosScoreA').textContent.startsWith('90/90'), 'KOS total in UI');
      assert(doc.querySelector('#rfsScoreA').textContent.startsWith('60/60'), 'RFS total in UI');
      for (const person of ['A', 'B']) {
        doc.querySelector('#promisQuestions input[name$="interestLevel"][value="5"]').click();
        doc.querySelector('#promisQuestions input[name$="interestFrequency"][value="5"]').click();
        doc.querySelector('#promisQuestions input[name$="activity"][value="1"]').click();
        doc.querySelector('#promisQuestions .reason-choice-grid input').click();
        doc.querySelector('#submitPromisBtn').click();
      }
      assert(!doc.querySelector('#promisResults').hidden, 'PROMIS conditional local dyadic result unlock');
      assert(
        doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1,
        `supplement mobile overflow: ${doc.documentElement.scrollWidth}/${doc.documentElement.clientWidth}`
      );
      doc.querySelector('[data-tab="longitudinal"]').click();
      assert(doc.querySelector('#longitudinalFiles').multiple, 'multiple longitudinal file upload');

      assert(
        doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1,
        `mobile horizontal overflow: ${doc.documentElement.scrollWidth}/${doc.documentElement.clientWidth}`
      );
      result.textContent = 'PASS';
    } catch (error) {
      result.textContent = `FAIL: ${error.message}`;
    }
  }, { once: true });
</script>
